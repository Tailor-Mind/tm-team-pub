name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install mermaid-cli + Chrome
        run: |
          npm i -D @mermaid-js/mermaid-cli
          npx puppeteer browsers install chrome

      - name: Render Mermaid diagrams to SVG
        run: |
          mkdir -p public/img/flows
          npx mmdc -p .puppeteer.json -i diagrams/hiring-funnel.mmd -o public/img/flows/hiring-funnel.svg -b transparent
          npx mmdc -p .puppeteer.json -i diagrams/scoring.mmd       -o public/img/flows/scoring.svg       -b transparent

      - name: Build
        env:
          PUBLIC_TRACK_ENDPOINT: ${{ vars.PUBLIC_TRACK_ENDPOINT }}
          PUBLIC_APPLY_FORM_URL_EN: ${{ vars.PUBLIC_APPLY_FORM_URL_EN }}
          PUBLIC_APPLY_FORM_URL_ES: ${{ vars.PUBLIC_APPLY_FORM_URL_ES }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
