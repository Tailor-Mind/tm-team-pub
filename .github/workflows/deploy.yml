name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Los diagramas ya no se generan aqui.
      #
      # Instalar mermaid-cli y descargar Chrome en cada despliegue costaba
      # entre uno y QUINCE minutos —un despliegue se quedo 14m41s en ese paso
      # sin llegar a construir— para regenerar dos SVG identicos. Los .mmd
      # cambian una vez cada varios meses, asi que los SVG viven en
      # public/img/flows/ y se vuelven a generar a mano cuando toque:
      #
      #   npx mmdc -p .puppeteer.json -i diagrams/<x>.mmd \
      #            -o public/img/flows/<x>.svg -b transparent
      #
      # Publicar un cambio de texto no deberia depender de bajarse un
      # navegador.

      - name: Build
        env:
          PUBLIC_TRACK_ENDPOINT: ${{ vars.PUBLIC_TRACK_ENDPOINT }}
          PUBLIC_APPLY_FORM_URL_EN: ${{ vars.PUBLIC_APPLY_FORM_URL_EN }}
          PUBLIC_APPLY_FORM_URL_ES: ${{ vars.PUBLIC_APPLY_FORM_URL_ES }}
          PUBLIC_RETO_REPO_URL: ${{ vars.PUBLIC_RETO_REPO_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
