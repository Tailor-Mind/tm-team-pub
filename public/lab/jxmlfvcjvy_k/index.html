<title>La fábrica</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d1117; color: #e6edf3;
    font: 14px/1.6 IBM Plex Sans, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  /* Everything here is scoped to #lock. These rules outlive the lock — the page
     they unlock is inserted into the same document — and a bare rule on input
     or button leaking into the app underneath wrecks its layout. */
  #lock { min-height: 100%; display: grid; place-items: center; padding: 24px; }
  #lock form { width: min(420px, 100%); }
  #lock h1 { margin: 0 0 6px; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  #lock p { margin: 0 0 18px; color: #8b98a5; font-size: 13px; }
  #lock label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: #5c6773; margin-bottom: 6px; }
  #lock input { width: 100%; font: 15px IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #161b22; color: #e6edf3; border: 1px solid #2a323c; border-radius: 8px; padding: 11px 13px; }
  #lock input:focus-visible { outline: 2px solid #4f9cf9; outline-offset: 1px; border-color: #4f9cf9; }
  #lock button { margin-top: 12px; width: 100%; font: 600 14px inherit; cursor: pointer;
    background: #4f9cf9; color: #06121f; border: 0; border-radius: 8px; padding: 11px 16px; }
  #lock button:disabled { opacity: .5; cursor: progress; }
  #lock #msg { margin-top: 12px; font-size: 12.5px; min-height: 1.4em; color: #f85149; }
  #lock #msg.ok { color: #8b98a5; }
</style>
</head>

  <div id="msg"></div>
</form></div>

const bytes = (b64s) => Uint8Array.from(atob(b64s), (c) => c.charCodeAt(0));
const msg = document.getElementById('msg');
const input = document.getElementById('k');
const button = document.getElementById('go');

async function open(key) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(key), 'PBKDF2', false, ['deriveKey']);
  const aes = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(DATA.salt), iterations: DATA.iter, hash: 'SHA-256' },
    material, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(DATA.iv) }, aes, bytes(DATA.ct));
  return new TextDecoder().decode(plain);
}

/** innerHTML never runs a script tag; each one has to be rebuilt to execute. */
function install(html) {
  document.getElementById('lock').remove();
  const doc = new DOMParser().parseFromString('<body>' + html + '</body>', 'text/html');
  for (const node of [...doc.head.childNodes, ...doc.body.childNodes]) {
    if (node.tagName === 'SCRIPT') {
      const s = document.createElement('script');
      for (const a of node.attributes) s.setAttribute(a.name, a.value);
      s.textContent = node.textContent;
      document.body.appendChild(s);
    } else if (node.tagName === 'TITLE') {
      document.title = node.textContent;
    } else {
      document.body.appendChild(document.importNode(node, true));
    }
  }
}

async function tryKey(key, fromUrl) {
  if (!key) return;
  button.disabled = true;
  msg.className = 'ok';
  msg.textContent = 'Descifrando…';
  try {
    install(await open(key.trim()));
  } catch {
    button.disabled = false;
    msg.className = '';
    msg.textContent = fromUrl ? 'La llave del enlace no abre esta página.' : 'Esa llave no abre esta página.';
    input.focus();
    input.select();
  }
}

document.querySelector('form').addEventListener('submit', (e) => { e.preventDefault(); tryKey(input.value, false); });

// A key in the fragment never reaches the server, so it stays out of the host's
// logs. Strip it from the bar once used so it does not linger in history.
const fromHash = new URLSearchParams(location.hash.slice(1)).get('k');
if (fromHash) {
  history.replaceState(null, '', location.pathname + location.search);
  tryKey(fromHash, true);
} else {
  input.focus();
}
